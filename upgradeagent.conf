# NVMesh upgrade agent configuration file
# This configuration file is utilized by NVMesh(r) applications for various options.

# The DEFAULT_KEEPALIVE_INTERVAL sets the default interval (in seconds) for sending keepalive messages
DEFAULT_KEEPALIVE_INTERVAL = 5

# The DATA_COLLECTION_CHECK_INTERVAL sets the default interval (in seconds) for checking if collected data has changed
DATA_COLLECTION_CHECK_INTERVAL = 5

# The CONSUMER_POLL_TIMEOUT sets the default timeout (in seconds) for polling messages from the Kafka topic
CONSUMER_POLL_TIMEOUT = 1.0

# The PRODUCER_POLL_TIMEOUT sets the default timeout (in seconds) for polling messages ACKS from the Kafka topic
PRODUCER_POLL_TIMEOUT = 0.1

# The ARTIFACTS_DIR option sets the directory where the artifacts are stored
ARTIFACTS_DIR = "/var/nvmesh/artifacts"

# The KAFKA_SERVERS option sets the addresses of the Kafka servers
# This option is required if KAFKA_SERVERS is not set in nvmesh.conf
# The format is KAFKA_SERVERS=server1:port1,server2:port2,server3:port3
# KAFKA_SERVERS="server1:port1,server2:port2,server3:port3"

# MTLS Configuration
# Set KAFKA_TLS_ENABLED="true" to enable MTLS for Kafka connections
KAFKA_TLS_ENABLED = "false"

# Path to the client certificate file (PEM format)
KAFKA_SSL_CERTIFICATE = "/etc/nvmesh/certs/client.cert.pem"

# Path to the client key file (PEM format)
KAFKA_SSL_KEY = "/etc/nvmesh/certs/client.key.pem"

# Path to the CA certificate file (PEM format)
KAFKA_SSL_CA = "/etc/nvmesh/certs/ca.pem"

# Password for the client key file (if encrypted)
# KAFKA_SSL_KEY_PASSWORD = "your-key-password"
