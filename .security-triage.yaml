false_positives: []

accepted_risks:
  - slug: "threat-remote-command-execution-via-kafka-command-messages"
    threat: "Remote command execution via Kafka command messages: handleUpgradeAgentCommand -> handleAgentCommand -> runUpgradeAgentCommand in src/upgradeagent.py execute cmd/args/timeout from the upgradeAgentCommand payload"
    severity: "high"
    reason: "Remote command execution over Kafka is the agent's intended function by design; the design was reviewed and approved by security. Mitigated operationally by restricting Kafka command-topic access and enabling mutual TLS to the broker."
    triaged_by: "Ido Yehiam"
    date: "2026-07-21"
  - slug: "threat-shell-injection-via-verification-commands"
    threat: "Shell injection via verification commands: handleVerificationCommand passes the message-supplied verificationCommand into runCommand, which invokes subprocess.run(pipeline, shell=True, executable=/bin/bash)"
    severity: "high"
    reason: "Verification commands are supplied by the trusted management server over the same approved Kafka control channel as upgrade commands; part of the reviewed and security-approved design. Mitigated operationally by restricting Kafka command-topic access and enabling mutual TLS to the broker."
    triaged_by: "Ido Yehiam"
    date: "2026-07-21"

